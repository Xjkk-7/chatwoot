version: '3'

services:
  web:
    image: chatwoot/chatwoot:latest
    env_file: .env.docker
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - redis
    volumes:
      - storage_data:/app/storage
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    image: chatwoot/chatwoot:latest
    env_file: .env.docker
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    depends_on:
      - postgres
      - redis
    volumes:
      - storage_data:/app/storage
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot_production
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=chatwoot_postgres_secure_password_2024

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"chatwoot_redis_secure_password_2024\""]
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'

volumes:
  storage_data:
  postgres_data:
  redis_data: 