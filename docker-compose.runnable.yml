version: '3'

services:
  postgres:
    image: postgres:12-alpine
    restart: always
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot_production
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  redis:
    image: redis:alpine
    restart: always
    command: redis-server
    volumes:
      - redis:/data

  chatwoot:
    image: chatwoot/chatwoot:v2.18.0
    restart: always
    ports:
      - 3000:3000
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - POSTGRES_HOST=postgres
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=chatwoot_production
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY_BASE=2bbe5972508883b70e91578a79da7b3f88f9940af61565d4149cd1835e0f58f22e65d275f1bc3892f2dd10ddbc9b441410994333d7b4f7c657da957bf01057d1
      - FRONTEND_URL=http://localhost:3000
      - FORCE_SSL=false
      - ENABLE_ACCOUNT_SIGNUP=true
      - INSTALLATION_NAME=Support Hub
      - INSTALLATION_ENV=docker
    depends_on:
      - postgres
      - redis
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    volumes:
      - ./public:/app/public
      - ./storage:/app/storage
      - ./log:/app/log

  sidekiq:
    image: chatwoot/chatwoot:v2.18.0
    restart: always
    depends_on:
      - postgres
      - redis
      - chatwoot
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=chatwoot_production
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY_BASE=2bbe5972508883b70e91578a79da7b3f88f9940af61565d4149cd1835e0f58f22e65d275f1bc3892f2dd10ddbc9b441410994333d7b4f7c657da957bf01057d1
      - INSTALLATION_NAME=Support Hub
      - INSTALLATION_ENV=docker
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes:
      - ./public:/app/public
      - ./storage:/app/storage
      - ./log:/app/log

volumes:
  postgres:
  redis: 