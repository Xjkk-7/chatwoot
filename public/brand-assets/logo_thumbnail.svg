<?xml version="1.0" encoding="UTF-8"?>
<svg width="512px" height="512px" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Custom Chat Platform Thumbnail</title>
    <desc>Favicon and thumbnail logo for customer support platform</desc>
    <g id="Logo" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <g id="thumbnail_logo" fill-rule="nonzero">
            <!-- Background circle -->
            <circle id="background" fill="#2563EB" cx="256" cy="256" r="256"></circle>
            
            <!-- Inner circle -->
            <circle id="inner" fill="#FFFFFF" cx="256" cy="256" r="200"></circle>
            
            <!-- Chat bubble design -->
            <path d="M160 160 C160 130, 186 104, 216 104 L296 104 C326 104, 352 130, 352 160 L352 240 C352 270, 326 296, 296 296 L236 296 L180 340 L180 296 C160 296, 160 270, 160 240 Z" 
                  fill="#2563EB" stroke="none"></path>
            
            <!-- Message dots -->
            <circle cx="206" cy="200" r="12" fill="#FFFFFF"></circle>
            <circle cx="256" cy="200" r="12" fill="#FFFFFF"></circle>
            <circle cx="306" cy="200" r="12" fill="#FFFFFF"></circle>
            
            <!-- Small "CS" text for Customer Support -->
            <text x="256" y="420" font-family="Inter, system-ui, sans-serif" font-size="100" font-weight="800" fill="#2563EB" text-anchor="middle">
                CS
            </text>
        </g>
    </g>
</svg>
