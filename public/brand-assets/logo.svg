<?xml version="1.0" encoding="UTF-8"?>
<svg width="2458px" height="512px" viewBox="0 0 2458 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Custom Chat Platform Logo</title>
    <desc>Professional customer support platform logo</desc>
    <g id="Logo" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <g id="custom_logo" fill-rule="nonzero">
            <!-- Modern circular icon -->
            <circle id="background-circle" fill="#2563EB" cx="256" cy="256" r="240"></circle>
            <circle id="inner-circle" fill="#FFFFFF" cx="256" cy="256" r="180"></circle>
            
            <!-- Chat bubble design -->
            <path d="M180 180 C180 160, 196 144, 216 144 L296 144 C316 144, 332 160, 332 180 L332 240 C332 260, 316 276, 296 276 L236 276 L200 310 L200 276 C180 276, 180 260, 180 240 Z" 
                  fill="#2563EB" stroke="none"></path>
            
            <!-- Message dots -->
            <circle cx="226" cy="210" r="8" fill="#FFFFFF"></circle>
            <circle cx="256" cy="210" r="8" fill="#FFFFFF"></circle>
            <circle cx="286" cy="210" r="8" fill="#FFFFFF"></circle>
            
            <!-- Company name text -->
            <text x="600" y="280" font-family="Inter, system-ui, sans-serif" font-size="120" font-weight="700" fill="#1E293B" letter-spacing="-2px">
                Customer Support Hub
            </text>
            
            <!-- Tagline -->
            <text x="600" y="360" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="400" fill="#64748B" letter-spacing="-1px">
                Intelligent Customer Conversations
            </text>
        </g>
    </g>
</svg>