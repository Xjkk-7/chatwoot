# Root directory and index
root /app/public;
index index.html;

# Security headers
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Error pages
error_page 500 502 503 504 /500.html;
error_page 404 /404.html;

# Health check endpoint
location /health {
    proxy_pass http://chatwoot_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}

# Static assets with caching
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Try to serve static files first, fallback to app
    try_files $uri @chatwoot_app;
}

# Widget API with rate limiting
location /api/v1/widget/ {
    limit_req zone=widget burst=5 nodelay;
    proxy_pass http://chatwoot_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
}

# API endpoints with rate limiting
location /api/ {
    limit_req zone=api burst=10 nodelay;
    proxy_pass http://chatwoot_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
}

# WebSocket support for Action Cable
location /cable {
    proxy_pass http://chatwoot_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# File uploads
location /rails/active_storage/ {
    client_max_body_size 50M;
    proxy_pass http://chatwoot_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
}

# Main application
location @chatwoot_app {
    proxy_pass http://chatwoot_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
}

# Default location
location / {
    try_files $uri $uri/index.html $uri.html @chatwoot_app;
}

# Deny access to sensitive files
location ~ /\. {
    deny all;
}

location ~ /(config|log|tmp|vendor|spec) {
    deny all;
} 